services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATA_DIR: /data
      PORT: 3001
    env_file:
      - ./.env
    volumes:
      - ./server:/data
    restart: unless-stopped

  web:
    build: .
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped